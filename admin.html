<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delux Grill - لوحة الإدارة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:16px;color:#222}
main{max-width:760px;margin:auto}
h1{font-size:25px}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
input,textarea,select{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #bbb;border-radius:7px;font-size:16px}
button{padding:12px 16px;margin:5px 2px;border:0;border-radius:7px;background:#222;color:white;font-size:15px;cursor:pointer}
.green{background:#16803c}.red{background:#b42318}.orange{background:#b75b00}
.item{border:1px solid #ddd;padding:12px;margin:8px 0;border-radius:8px}
.muted{color:#666;font-size:14px}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>🍕 Delux Grill – لوحة الإدارة</h1>

<div class="card" id="loginBox">
<h3>تسجيل الدخول</h3>
<input id="email" type="email" placeholder="البريد الإلكتروني" value="deluxgrill33@gmail.com">
<input id="password" type="password" placeholder="كلمة المرور">
<button class="green" onclick="login()">دخول</button>
<p id="loginMessage"></p>
</div>

<div id="app" class="hidden">
<div class="card">
<button onclick="logout()">تسجيل الخروج</button>
<p id="status">أهلًا بك في إدارة المنيو.</p>
</div>

<div class="card">
<h3>بيانات المطعم</h3>
<label>اسم المطعم</label>
<input id="restaurant" value="Delux Grill Laatzen">
<label>العنوان</label>
<input id="address" value="Hildesheimer Str. 520, Laatzen">
</div>

<div class="card">
<h3>إضافة صنف جديد</h3>
<label>القسم</label>
<select id="category">
<option value="pizza">🍕 بيتزا / Pizza</option>
<option value="burger">🍔 برغر / Burger</option>
<option value="snack">🍟 سناك / Snacks</option>
<option value="drinks">🥤 مشروبات / Getränke</option>
</select>
<label>اسم الصنف بالعربية</label>
<input id="nameAr" placeholder="مثال: بيتزا مارغريتا">
<label>اسم الصنف بالألمانية</label>
<input id="nameDe" placeholder="مثال: Pizza Margherita">
<label>السعر باليورو</label>
<input id="price" type="number" min="0" step="0.10" placeholder="مثال: 7.50">
<label>الوصف (اختياري)</label>
<input id="description" placeholder="مكونات الصنف">
<label>الإضافات، افصل بينها بفاصلة (اختياري)</label>
<input id="extras" placeholder="جبنة إضافية, زيتون">
<button class="green" onclick="addItem()">➕ إضافة الصنف</button>
</div>

<div class="card">
<h3>أقسام المنيو والأصناف</h3>
<div id="menuItems"></div>
</div>

<div class="card">
<button onclick="loadDraft()">تحميل المسودة</button>
<button class="orange" onclick="saveDraft()">حفظ المسودة</button>
<button class="green" onclick="publishMenu()">نشر المنيو</button>
<p class="muted">حفظ المسودة لا ينشر التغييرات للزبائن. النشر يحفظ المنيو في قاعدة البيانات.</p>
</div>
</div>
</main>

<script>
const PROJECT_URL = "https://kweesbbghzvxjgwhdnqo.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_QT_7w8KNYAfF1cpJytBhJw_ZjjxflPu";
const ADMIN_UID = "b9b71c76-83d7-4ae2-bfbb-3584a951b58a";

const db = window.supabase.createClient(PROJECT_URL, PUBLISHABLE_KEY);

const categoryNames = {
  pizza: {ar:"بيتزا",de:"Pizza"},
  burger: {ar:"برغر",de:"Burger"},
  snack: {ar:"سناك",de:"Snacks"},
  drinks: {ar:"مشروبات",de:"Getränke"}
};

let menu = {
  restaurant:"Delux Grill Laatzen",
  address:"Hildesheimer Str. 520, Laatzen",
  currency:"EUR",
  categories:[],
  delivery:{enabled:true,fee:null},
  languages:["de","ar","tr","en","pl"]
};

function message(text){
  document.getElementById("status").textContent = text;
}

function ensureCategories(){
  for(const id of Object.keys(categoryNames)){
    let cat = menu.categories.find(c => c.id === id);
    if(!cat){
      cat = {
        id:id,
        nameAr:categoryNames[id].ar,
        nameDe:categoryNames[id].de,
        items:[]
      };
      menu.categories.push(cat);
    }
    if(!Array.isArray(cat.items)) cat.items=[];
  }
}

function getCat(id){
  ensureCategories();
  return menu.categories.find(c => c.id === id);
}

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  document.getElementById("loginMessage").textContent="جارٍ تسجيل الدخول...";
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error){
    document.getElementById("loginMessage").textContent="تعذّر الدخول: "+error.message;
    return;
  }
  if(data.user.id !== ADMIN_UID){
    await db.auth.signOut();
    document.getElementById("loginMessage").textContent="هذا الحساب ليس حساب الإدارة المصرّح به.";
    return;
  }
  showApp();
  await loadDraft();
}

async function showApp(){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
}

async function logout(){
  await db.auth.signOut();
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("password").value="";
}

function readDetails(){
  menu.restaurant=document.getElementById("restaurant").value.trim();
  menu.address=document.getElementById("address").value.trim();
}

function render(){
  ensureCategories();
  const root=document.getElementById("menuItems");
  root.innerHTML="";
  for(const id of Object.keys(categoryNames)){
    const cat=getCat(id);
    const section=document.createElement("div");
    section.className="item";
    const heading=document.createElement("h3");
    heading.textContent=categoryNames[id].ar+" / "+categoryNames[id].de;
    section.appendChild(heading);

    if(cat.items.length===0){
      const empty=document.createElement("p");
      empty.className="muted";
      empty.textContent="لا توجد أصناف في هذا القسم بعد.";
      section.appendChild(empty);
    }

    cat.items.forEach((item,index)=>{
      const row=document.createElement("div");
      row.className="item";
      const title=document.createElement("strong");
      title.textContent=(item.nameAr||"بدون اسم")+" / "+(item.nameDe||"No name");
      row.appendChild(title);

      const price=document.createElement("p");
      price.textContent=Number(item.price||0).toFixed(2)+" €";
      row.appendChild(price);

      const available=document.createElement("p");
      available.className="muted";
      available.textContent=item.available===false?"غير متوفر":"متوفر";
      row.appendChild(available);

      const edit=document.createElement("button");
      edit.textContent="تعديل";
      edit.onclick=()=>editItem(id,index);
      row.appendChild(edit);

      const toggle=document.createElement("button");
      toggle.className="orange";
      toggle.textContent=item.available===false?"تفعيل":"إيقاف مؤقت";
      toggle.onclick=()=>{
        item.available=item.available===false;
        render();
      };
      row.appendChild(toggle);

      const remove=document.createElement("button");
      remove.className="red";
      remove.textContent="حذف";
      remove.onclick=()=>{
        if(confirm("هل تريد حذف هذا الصنف؟")){
          cat.items.splice(index,1);
          render();
        }
      };
      row.appendChild(remove);
      section.appendChild(row);
    });
    root.appendChild(section);
  }
}

function addItem(){
  const id=document.getElementById("category").value;
  const nameAr=document.getElementById("nameAr").value.trim();
  const nameDe=document.getElementById("nameDe").value.trim();
  const price=parseFloat(document.getElementById("price").value);
  if(!nameAr || !nameDe || !Number.isFinite(price) || price<0){
    alert("اكتب اسم الصنف بالعربية والألمانية وسعرًا صحيحًا.");
    return;
  }
  const extrasText=document.getElementById("extras").value.trim();
  getCat(id).items.push({
    id:crypto.randomUUID(),
    nameAr,
    nameDe,
    price,
    description:document.getElementById("description").value.trim(),
    extras:extrasText ? extrasText.split(",").map(x=>x.trim()).filter(Boolean):[],
    available:true
  });
  ["nameAr","nameDe","price","description","extras"].forEach(x=>document.getElementById(x).value="");
  render();
  message("تمت إضافة الصنف. اضغط حفظ المسودة أو نشر المنيو لحفظه في قاعدة البيانات.");
}

function editItem(id,index){
  const item=getCat(id).items[index];
  const ar=prompt("اسم الصنف بالعربية:",item.nameAr||"");
  if(ar===null)return;
  const de=prompt("اسم الصنف بالألمانية:",item.nameDe||"");
  if(de===null)return;
  const priceText=prompt("السعر باليورو:",String(item.price||0));
  if(priceText===null)return;
  const price=Number(priceText);
  if(!ar.trim()||!de.trim()||!Number.isFinite(price)||price<0){
    alert("الاسم والسعر غير صحيحين.");
    return;
  }
  item.nameAr=ar.trim();
  item.nameDe=de.trim();
  item.price=price;
  const desc=prompt("الوصف:",item.description||"");
  if(desc!==null)item.description=desc;
  const extras=prompt("الإضافات مفصولة بفاصلة:",(item.extras||[]).join(", "));
  if(extras!==null)item.extras=extras.split(",").map(x=>x.trim()).filter(Boolean);
  render();
}

async function saveToTable(table,successText){
  readDetails();
  ensureCategories();
  message("جارٍ الحفظ...");
  const {data:{user}}=await db.auth.getUser();
  if(!user || user.id!==ADMIN_UID){
    message("انتهت الجلسة. سجّل الدخول مرة أخرى.");
    return;
  }
  const {error}=await db.from(table).upsert({
    id:1,
    content:menu,
    updated_at:new Date().toISOString()
  });
  if(error){
    message("فشل الحفظ: "+error.message);
    return;
  }
  message(successText);
}

async function saveDraft(){
  await saveToTable("menu_drafts","تم حفظ المسودة بنجاح.");
}

async function publishMenu(){
  if(!confirm("هل تريد نشر المنيو الحالي؟"))return;
  await saveToTable("published_menu","تم نشر المنيو في قاعدة البيانات. يجب أن تكون صفحة الزبائن مبرمجة لقراءة published_menu.");
}

async function loadDraft(){
  message("جارٍ تحميل المسودة...");
  const {data,error}=await db.from("menu_drafts").select("content").eq("id",1).maybeSingle();
  if(error){
    message("تعذّر تحميل المسودة: "+error.message);
    return;
  }
  if(data && data.content){
    menu=data.content;
  }else{
    const {data:published,error:pubError}=await db.from("published_menu").select("content").eq("id",1).maybeSingle();
    if(pubError){
      message("تعذّر تحميل المنيو المنشور: "+pubError.message);
      return;
    }
    if(published && published.content) menu=published.content;
  }
  menu.restaurant=menu.restaurant||"Delux Grill Laatzen";
  menu.address=menu.address||"Hildesheimer Str. 520, Laatzen";
  document.getElementById("restaurant").value=menu.restaurant;
  document.getElementById("address").value=menu.address;
  ensureCategories();
  render();
  message("تم تحميل المنيو. يمكنك إضافة الأصناف وتعديلها.");
}

db.auth.getSession().then(async ({data})=>{
  if(data.session && data.session.user.id===ADMIN_UID){
    await showApp();
    await loadDraft();
  }
});
</script>
</body>
</html>
