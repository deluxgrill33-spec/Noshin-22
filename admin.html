
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delux Grill - لوحة الإدارة</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 750px; margin: 25px auto; padding: 16px; background: #f4f4f4; }
    .panel { background: white; padding: 20px; border-radius: 10px; margin-bottom: 16px; }
    input, textarea, button { box-sizing: border-box; width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; }
    textarea { min-height: 320px; direction: ltr; text-align: left; }
    button { cursor: pointer; background: #a32020; color: white; border: 0; border-radius: 6px; }
    #status { margin-top: 15px; padding: 12px; background: #fff4d6; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Delux Grill – لوحة الإدارة</h1>

  <div class="panel">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm">
      <input id="email" type="email" placeholder="البريد الإلكتروني" required>
      <input id="password" type="password" placeholder="كلمة المرور" required>
      <button type="submit">تسجيل الدخول</button>
    </form>
    <button id="logoutBtn" hidden>تسجيل الخروج</button>
    <div id="status">جاري الاتصال...</div>
  </div>

  <div class="panel" id="editor" hidden>
    <h2>تعديل المنيو</h2>
    <textarea id="menuData" spellcheck="false"></textarea>
    <button id="loadBtn">تحميل المسودة</button>
    <button id="saveBtn">حفظ المسودة</button>
    <button id="publishBtn">نشر المنيو</button>
  </div>

<script>
const PROJECT_URL = "https://kweesbbghzvxjgwhdnqo.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_QT_7w8KNYAfF1cpJytBhJw_ZjjxflPu";
const ADMIN_UID = "b9b71c76-83d7-4ae2-bfbb-3584a951b58a";

const statusBox = document.getElementById("status");
const loginForm = document.getElementById("loginForm");
const editor = document.getElementById("editor");
const logoutBtn = document.getElementById("logoutBtn");
const menuData = document.getElementById("menuData");

let client = null;
let currentUser = null;

function status(message) {
  statusBox.textContent = message;
}

function parseMenu() {
  try {
    return JSON.parse(menuData.value);
  } catch {
    throw new Error("صيغة المنيو غير صحيحة. تأكد من JSON.");
  }
}

async function loadDraft() {
  try {
    const { data, error } = await client
      .from("menu_drafts")
      .select("content")
      .eq("id", 1)
      .maybeSingle();

    if (error) throw error;

    if (data?.content) {
      menuData.value = JSON.stringify(data.content, null, 2);
      status("تم تحميل المسودة.");
      return;
    }

    const response = await fetch("./menu.json", { cache: "no-store" });
    if (!response.ok) throw new Error("تعذّر تحميل menu.json.");

    menuData.value = JSON.stringify(await response.json(), null, 2);
    status("تم تحميل المنيو الأساسي. يمكنك تعديله وحفظه.");
  } catch (error) {
    status("خطأ في تحميل المنيو: " + error.message);
  }
}

async function saveDraft() {
  try {
    const content = parseMenu();
    const { error } = await client.from("menu_drafts").upsert({
      id: 1,
      content,
      updated_at: new Date().toISOString()
    });
    if (error) throw error;
    status("تم حفظ المسودة بنجاح.");
  } catch (error) {
    status("فشل حفظ المسودة: " + error.message);
  }
}

async function publishMenu() {
  try {
    if (!confirm("هل تريد نشر المنيو؟")) return;
    const content = parseMenu();
    const { error } = await client.from("published_menu").upsert({
      id: 1,
      content,
      updated_at: new Date().toISOString()
    });
    if (error) throw error;
    status("تم النشر في قاعدة البيانات. يجب أن تكون صفحة الزبائن مبرمجة لقراءة published_menu.");
  } catch (error) {
    status("فشل النشر: " + error.message);
  }
}

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!client) {
    status("الاتصال غير جاهز. تحقق من المفتاح العام.");
    return;
  }

  status("جاري تسجيل الدخول...");
  try {
    const { data, error } = await client.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });
    if (error) throw error;

    if (!data.user || data.user.id !== ADMIN_UID) {
      await client.auth.signOut();
      status("هذا الحساب غير مخوّل للإدارة.");
      return;
    }

    currentUser = data.user;
    loginForm.hidden = true;
    logoutBtn.hidden = false;
    editor.hidden = false;
    await loadDraft();
  } catch (error) {
    status("فشل تسجيل الدخول: " + error.message);
  }
});

logoutBtn.addEventListener("click", async () => {
  await client.auth.signOut();
  currentUser = null;
  loginForm.hidden = false;
  logoutBtn.hidden = true;
  editor.hidden = true;
  status("تم تسجيل الخروج.");
});

document.getElementById("loadBtn").addEventListener("click", loadDraft);
document.getElementById("saveBtn").addEventListener("click", saveDraft);
document.getElementById("publishBtn").addEventListener("click", publishMenu);

async function initialize() {
  if (!window.supabase) {
    status("تعذّر تحميل مكتبة Supabase. تحقق من الإنترنت.");
    return;
  }

  try {
    client = window.supabase.createClient(PROJECT_URL, PUBLISHABLE_KEY);
    const { data, error } = await client.auth.getSession();
    if (error) throw error;

    if (data.session?.user) {
      if (data.session.user.id !== ADMIN_UID) {
        await client.auth.signOut();
        status("هذا الحساب غير مخوّل للإدارة.");
        return;
      }

      currentUser = data.session.user;
      loginForm.hidden = true;
      logoutBtn.hidden = false;
      editor.hidden = false;
      await loadDraft();
    } else {
      status("الاتصال جاهز. أدخل بيانات حساب الإدارة.");
    }
  } catch (error) {
    client = null;
    status("خطأ في الاتصال: " + error.message);
  }
}

initialize();
</script>
</body>
</html>
