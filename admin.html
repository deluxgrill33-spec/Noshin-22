<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delux Grill – لوحة الإدارة</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 25px auto;
      padding: 16px;
      background: #f5f5f5;
      color: #222;
    }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      font-size: 16px;
      border-radius: 7px;
    }
    input, textarea { border: 1px solid #bbb; }
    textarea {
      min-height: 300px;
      direction: ltr;
      text-align: left;
      font-family: monospace;
    }
    button {
      border: 0;
      background: #222;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .secondary { background: #555; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
    .hint { color: #555; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Delux Grill</h1>
    <h2>لوحة الإدارة</h2>
    <p class="hint">سجّل الدخول بحساب الإدارة الذي أنشأته في Supabase.</p>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="username"
             required>

      <label for="password">كلمة المرور</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button type="submit">تسجيل الدخول</button>
    </form>

    <button id="logoutBtn" class="secondary" hidden>
      تسجيل الخروج
    </button>
    <p id="status" role="status">بانتظار تسجيل الدخول.</p>
  </div>

  <div class="panel" id="editor" hidden>
    <h2>بيانات المنيو</h2>
    <p class="hint">
      هذه مسودة بصيغة JSON. احتفظ بنسخة من بياناتك قبل تعديلها.
    </p>

    <textarea id="menuData" spellcheck="false">{
  "restaurant": "Delux Grill Laatzen",
  "address": "Hildesheimer Str. 520, Laatzen",
  "currency": "EUR",
  "categories": [],
  "delivery": {
    "enabled": true,
    "fee": null
  },
  "languages": ["de", "ar", "tr", "en", "pl"]
}</textarea>

    <button id="loadBtn" class="secondary">
      تحميل المسودة المحفوظة
    </button>
    <button id="saveBtn">حفظ المسودة</button>
    <button id="publishBtn">نشر المنيو</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const PROJECT_URL =
      "https://kweesbbghzvxjgwhdnqo.supabase.co";

    // ضع هنا قيمة Publishable key التي نسختها من Supabase.
    // لا تستخدم Secret أو service_role.
    const PUBLISHABLE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

    const ADMIN_UID = "b9b71c76-83d7-4ae2-bfbb-3584a951b58a";

    const statusBox = document.getElementById("status");
    const editor = document.getElementById("editor");
    const loginForm = document.getElementById("loginForm");
    const logoutBtn = document.getElementById("logoutBtn");
    const menuData = document.getElementById("menuData");

    let client = null;
    let currentUser = null;

    function status(message) {
      statusBox.textContent = message;
    }

    function setLoggedIn(user) {
      currentUser = user;
      const isAdmin = user && user.id === ADMIN_UID;

      editor.hidden = !isAdmin;
      logoutBtn.hidden = !user;
      loginForm.hidden = !!user;

      if (user && !isAdmin) {
        status("هذا الحساب ليس حساب الإدارة المصرّح له.");
      } else if (isAdmin) {
        status("تم تسجيل الدخول. يمكنك إدارة المسودة.");
      }
    }

    function requireAdmin() {
      if (!currentUser || currentUser.id !== ADMIN_UID) {
        throw new Error("يجب تسجيل الدخول بحساب الإدارة.");
      }
    }

    function parseMenu() {
      const parsed = JSON.parse(menuData.value);
      if (!parsed || typeof parsed !== "object" ||
          Array.isArray(parsed)) {
        throw new Error("بيانات المنيو يجب أن تكون JSON صالحاً.");
      }
      return parsed;
    }

    async function loadDraft() {
      requireAdmin();
      status("جارٍ تحميل المسودة...");

      const { data, error } = await client
        .from("menu_drafts")
        .select("content")
        .eq("id", 1)
        .maybeSingle();

      if (error) throw error;

      if (!data) {
        status("لا توجد مسودة محفوظة بعد. يمكنك حفظ البيانات الظاهرة.");
        return;
      }

      menuData.value = JSON.stringify(data.content, null, 2);
      status("تم تحميل المسودة.");
    }

    async function saveDraft() {
      requireAdmin();
      const content = parseMenu();

      const { error } = await client
        .from("menu_drafts")
        .upsert(
          { id: 1, content, updated_at: new Date().toISOString() },
          { onConflict: "id" }
        );

      if (error) throw error;
      status("تم حفظ المسودة بنجاح.");
    }

    async function publishMenu() {
      requireAdmin();

      if (!confirm("هل تريد نشر المسودة الحالية؟")) return;

      const content = parseMenu();

      // احفظ المسودة أولاً، ثم انشر محتواها.
      await saveDraft();

      const { error } = await client
        .from("published_menu")
        .upsert(
          { id: 1, content, updated_at: new Date().toISOString() },
          { onConflict: "id" }
        );

      if (error) throw error;

      status(
        "تم حفظ المنيو في جدول النشر. " +
        "يجب ربط صفحة الزبائن بهذا الجدول كي يظهر المنيو المنشور لديهم."
      );
    }

    function handleError(error) {
      console.error(error);
      status("تعذّر إتمام العملية: " + (error.message || "خطأ غير معروف"));
    }

    document.getElementById("saveBtn").addEventListener("click", async () => {
      try { await saveDraft(); } catch (e) { handleError(e); }
    });

    document.getElementById("loadBtn").addEventListener("click", async () => {
      try { await loadDraft(); } catch (e) { handleError(e); }
    });

    document.getElementById("publishBtn").addEventListener("click", async () => {
      try { await publishMenu(); } catch (e) { handleError(e); }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      try {
        if (!client) {
          if (PUBLISHABLE_KEY === "PASTE_YOUR_PUBLISHABLE_KEY_HERE") {
            throw new Error("أضف Publishable key في مكانه داخل الكود أولاً.");
          }
          client = window.supabase.createClient(
            PROJECT_URL,
            PUBLISHABLE_KEY
          );
        }

        status("جارٍ تسجيل الدخول...");

        const { data, error } = await client.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) throw error;

        if (data.user.id !== ADMIN_UID) {
          await client.auth.signOut();
          setLoggedIn(null);
          throw new Error("هذا ليس حساب الإدارة المصرّح له.");
        }

        setLoggedIn(data.user);
      } catch (e) {
        handleError(e);
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        if (client) {
          const { error } = await client.auth.signOut();
          if (error) throw error;
        }
        setLoggedIn(null);
        status("تم تسجيل الخروج.");
      } catch (e) {
        handleError(e);
      }
    });

    async function initialize() {
      if (PUBLISHABLE_KEY === "sb_publishable_QT_7w8KNYAfF1cpJytBhJw_ZjjxflPu") {
        status("أضف Publishable key قبل تسجيل الدخول.");
        return;
      }

      client = window.supabase.createClient(
        PROJECT_URL,
        PUBLISHABLE_KEY
      );

      const { data, error } = await client.auth.getSession();
      if (error) {
        handleError(error);
        return;
      }

      if (data.session) setLoggedIn(data.session.user);
    }

    initialize();
  </script>
</body>
</html>
