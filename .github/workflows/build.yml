name: Build Delux apps
on:
  push:
    branches: [android-apps]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APKs
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p out
          cp radio/build/outputs/apk/debug/radio-debug.apk out/radio.apk
          cp tv/build/outputs/apk/debug/tv-debug.apk out/tv.apk
          ls -la out
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apps-${{ github.run_number }}
          name: Delux apps ${{ github.run_number }}
          make_latest: true
          files: |
            out/radio.apk
            out/tv.apk
      - name: Save APKs to apks branch
        run: |
          git config user.name "delux-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin apks || true
          mkdir /tmp/a && cp out/*.apk /tmp/a/
          git checkout --orphan apks-new
          git rm -rf . > /dev/null
          rm -rf radio tv gradle keys out .github build.gradle settings.gradle gradle.properties gradlew gradlew.bat .gitignore
          cp /tmp/a/*.apk .
          echo "build ${{ github.run_number }}" > BUILD.txt
          git add radio.apk tv.apk BUILD.txt
          git commit -m "APKs build ${{ github.run_number }}"
          git push -f origin HEAD:apks
