<style>
[hidden]{display:none!important}
:root{
  --room:#121417;--bezel:#1d2026;--bezel-edge:#2b2f37;--key:#23272e;--key-on:#0f5f57;
  --led:#3ee6c4;--ink:#e9ece8;--muted:#8d949c;--live:#e5484d;--star:#f2b84b;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --mono:"Share Tech Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--room);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;margin:0;padding:14px 16px 28px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:.5px}
h1 span{color:var(--led)}
.clock{font-family:var(--mono);color:var(--muted);font-size:15px}
.tv{background:var(--bezel);border:1px solid var(--bezel-edge);border-radius:18px;padding:12px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;background:#000}
video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  text-align:center;padding:16px;background:radial-gradient(circle at 50% 40%,#1c2229,#06080a)}
.overlay.off{background:#020303}
.overlay p{margin:0;font-size:15px;max-width:34ch}
.overlay small{color:var(--muted)}
.ovbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ovbtns a,.ovbtns button{color:#06120f;background:var(--led);text-decoration:none;font-weight:600;padding:7px 14px;border-radius:999px;border:0;font-size:14px}
.bug{position:absolute;top:10px;inset-inline-start:10px;display:flex;align-items:center;gap:6px;pointer-events:none;
  background:rgba(0,0,0,.55);padding:3px 9px;border-radius:6px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.bug.on .dot{background:var(--live);box-shadow:0 0 8px var(--live)}
.osd{position:absolute;bottom:10px;inset-inline-end:10px;display:flex;align-items:center;gap:8px;pointer-events:none;
  background:rgba(0,0,0,.65);padding:6px 10px;border-radius:8px;font-size:13px}
.osd .bars{display:flex;gap:2px;direction:ltr}
.osd .bars i{width:5px;height:12px;background:#3a3f47;border-radius:1px}
.osd .bars i.f{background:var(--led)}
.panel{display:flex;align-items:center;gap:10px;margin-top:10px}
.led{font-family:var(--mono);color:var(--led);background:#07100e;border:1px solid #17302b;border-radius:6px;
  padding:4px 10px;font-size:20px;letter-spacing:2px;text-shadow:0 0 6px rgba(62,230,196,.6);direction:ltr;flex:none}
.led.dim{color:#2a3a36;text-shadow:none}
.nowname{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--bezel-edge);background:var(--key);font-size:18px;color:var(--muted)}
.fav.on{color:var(--star)}
.remote{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:10px}
button{font:inherit;color:var(--ink);cursor:pointer}
.rk{height:48px;border-radius:12px;border:1px solid var(--bezel-edge);background:var(--key);font-size:17px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:0}
.rk small{font-size:10px;color:var(--muted)}
.rk:active{transform:translateY(1px)}
.rk.power{color:var(--live)} .rk.power.on{color:var(--led)} .rk.muted{color:var(--live)}
.rk.wide{grid-column:1/-1;height:40px;flex-direction:row;gap:8px}
.rk.wide small{font-size:13px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--bezel-edge);background:transparent;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--room);border-color:var(--ink);font-weight:600}
.tab b{font-family:var(--mono);font-weight:400;opacity:.7;margin-inline-start:6px}
.chip{flex:none;padding:4px 11px;border-radius:8px;border:0;background:var(--key);font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--key-on);color:var(--ink)}
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--bezel-edge);background:var(--key);color:var(--ink);font:inherit}
.search::placeholder{color:var(--muted)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);align-items:center}
.meta button{background:none;border:0;color:var(--led);font-size:12px;padding:2px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ch{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--bezel-edge);
  background:var(--key);text-align:start;min-width:0}
.logo{width:34px;height:34px;flex:none;border-radius:8px;background:#0c0f12;display:flex;align-items:center;justify-content:center;
  overflow:hidden;font-family:var(--mono);font-size:12px;color:var(--muted)}
.logo img{width:100%;height:100%;object-fit:contain}
.ch .t{display:flex;flex-direction:column;min-width:0}
.ch .t b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .t i{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch[aria-pressed="true"]{background:var(--key-on);border-color:var(--led)}
.more{padding:10px;border-radius:12px;border:1px dashed var(--bezel-edge);background:transparent;color:var(--muted)}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:20px 8px;font-size:14px}
.note{font-size:13px;color:var(--muted);margin:0}
html,body{height:100%;overflow:hidden}
body{height:100vh;height:100dvh;padding:8px 12px 0}
.wrap{height:100%;gap:8px}
header{flex:none}h1{font-size:20px}
.tv{flex:none;padding:8px;border-radius:14px}
.screen{max-height:34vh;margin:0 auto}
.panel{margin-top:6px}.fav{display:none}
.remote{grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:6px}
.rk{height:42px}.rk.wide{grid-column:auto;height:42px;flex-direction:column;gap:0}.rk.wide small{font-size:10px}
.tabs{flex:none}.tab{font-size:15px;padding:8px 16px}
#list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.ch{padding:12px 10px}.ch .t b{font-size:15px}
</style>

      <button class="rk wide" id="fs" aria-label="ملء الشاشة"><span>⛶</span><small>تكبير</small></button>
    </div>
  </section>

  <div class="tabs" id="tabs" role="tablist" aria-label="القوائم"></div>
  <div id="list"><div class="grid" id="grid"></div></div>
  <input id="q" hidden><div id="chips" hidden></div><span id="status" hidden></span><button id="refresh" hidden></button>
</div>

function parseM3U(txt){
  const out=new Map();const lines=txt.split(/\r?\n/);
  let info=null,bad=false;
  for(const raw of lines){
    const l=raw.trim();if(!l)continue;
    if(l.startsWith("#EXTINF")){
      const name=l.slice(l.lastIndexOf(",")+1);
      const logo=(l.match(/tvg-logo="([^"]*)"/)||[])[1]||"";
      const grp=(l.match(/group-title="([^"]*)"/)||[])[1]||"";

        if(!out.has(k))out.set(k,{name:info.name,logo:info.logo,cats:info.cats.length?info.cats:["undefined"],urls:[],site:""});
        const e=out.get(k);if(!e.urls.includes(l))e.urls.push(l);if(!e.logo&&info.logo)e.logo=info.logo;
      }
      info=null;
    }
  }
  return [...out.values()].sort((a,b)=>a.name.localeCompare(b.name));
}
async function loadAll(force){render();return;
  const cache=ls("tv3cache");
  if(cache&&!force&&Date.now()-cache.t<HOUR){LIST={...LIST,...cache.lists};lastUpdate=cache.t;render();return}
  $("status").textContent="عم يحدّث القوائم…";
  let got={},okAny=false;
  for(const S of SOURCES){
    let arr=[];
    for(const u of S.urls){
      try{const r=await fetch(u,{cache:"no-store"});if(r.ok){arr=arr.concat(parseM3U(await r.text()));okAny=true}}catch(e){}
    }
    const seen=new Map();arr.forEach(c=>{const k=c.name.toLowerCase();if(!seen.has(k))seen.set(k,c);else seen.get(k).urls.push(...c.urls)});
    got[S.id]=[...seen.values()];
  }
  if(okAny){LIST={...LIST,...got};lastUpdate=Date.now();try{localStorage.setItem("tv3cache",JSON.stringify({t:lastUpdate,lists:got}))}catch(e){}}
  else if(cache){LIST={...LIST,...cache.lists};lastUpdate=cache.t}
  render(okAny||cache?null:"ما قدرت جيب القوائم هلق — عم تشتغل «مختاراتي» بس");
}
setInterval(()=>loadAll(true),HOUR);

function tabsDef(){
  return CURATED.map(L=>({id:L.id,t:L.t}));
}
function itemsOf(id){
  if(id==="fav"){const all=allItems();return favs.map(k=>all.get(k)).filter(Boolean)}
  return LIST[id]||[];
}
function allItems(){const m=new Map();Object.values(LIST).forEach(a=>a.forEach(c=>{const k=c.name.toLowerCase();if(!m.has(k))m.set(k,c)}));return m}
function catLabel(c){return CAT_AR[c]||c}
function filtered(){
  let a=itemsOf(tab);
  if(cat!=="all")a=a.filter(c=>c.cats.includes(cat));
  if(query){const q=query.toLowerCase();a=a.filter(c=>c.name.toLowerCase().includes(q))}
  return a;
}
function render(msg){
  $("tabs").innerHTML="";
  tabsDef().forEach(T=>{
    const b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");
    b.setAttribute("aria-selected",T.id===tab?"true":"false");
    b.innerHTML=T.t+"<b>"+itemsOf(T.id).length+"</b>";
    b.onclick=()=>{tab=T.id;cat="all";shown=60;save();render()};
    $("tabs").appendChild(b);
  });
  const counts={};itemsOf(tab).forEach(c=>c.cats.forEach(x=>counts[x]=(counts[x]||0)+1));
  const cats=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  $("chips").innerHTML="";$("chips").hidden=cats.length<2;
  [["all","الكل"],...cats.map(c=>[c,catLabel(c)])].forEach(([id,t])=>{
    const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",id===cat?"true":"false");
    b.textContent=t;b.onclick=()=>{cat=id;shown=60;render()};$("chips").appendChild(b);
  });
  $("list").scrollTop=0;
  drawGrid();
}
function initials(n){return n.replace(/[^\p{L}\p{N} ]/gu,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"TV"}
function drawGrid(){
  const g=$("grid");g.innerHTML="";
  const a=filtered();
  if(!a.length){g.innerHTML=`<div class="empty">${tab==="fav"?"ما في قنوات مفضلة لسا — شغّل قناة واضغط ☆ لتضيفها":"ما في قنوات هون"}</div>`;return}
  a.slice(0,shown).forEach((c,i)=>{
    const k=c.name.toLowerCase();
    const b=document.createElement("button");b.className="ch";
    b.setAttribute("aria-pressed",(k===curKey&&isOn)?"true":"false");
    const lg=document.createElement("span");lg.className="logo";
    if(c.logo){const im=new Image();im.alt="";im.loading="lazy";im.referrerPolicy="no-referrer";im.src=c.logo;im.onerror=()=>{lg.textContent=initials(c.name)};lg.appendChild(im)}else lg.textContent=initials(c.name);
    const t=document.createElement("span");t.className="t";
    t.innerHTML=`<b></b><i></i>`;t.querySelector("b").textContent=c.name;
    t.querySelector("i").textContent=(k===curKey&&isOn)?"● عم تشتغل":"";
    b.append(lg,t);b.onclick=()=>play(c);
    g.appendChild(b);
  });
  if(a.length>shown){const m=document.createElement("button");m.className="more";m.style.gridColumn="1/-1";
    m.textContent=`اعرض كمان (${a.length-shown} قناة)`;m.onclick=()=>{shown+=60;drawGrid()};g.appendChild(m)}
}

function state(kind,text,small){
  const ov=$("ov");
  $("bug").classList.toggle("on",kind==="live");
  $("bugText").textContent=kind==="live"?"مباشر":kind==="load"?"عم يحمّل…":kind==="off"?"مطفي":"ما في بث";
  ov.classList.toggle("off",kind==="off");
  if(kind==="live"){ov.hidden=true;return}
  ov.hidden=false;$("ovText").textContent=text;$("ovSmall").textContent=small||"";
  const c=current();
  $("ovBtns").hidden=kind!=="fail";
  const l=$("ovLink");if(c&&c.site){l.href=c.site;l.hidden=false}else l.hidden=true;
}
function current(){if(!curKey)return null;return itemsOf(tab).find(c=>c.name.toLowerCase()===curKey)||allItems().get(curKey)||null}
function stopStream(){clearTimeout(failTimer);loading=false;if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute("src");try{v.load()}catch(e){}}
function setPower(on){
  isOn=on;$("power").classList.toggle("on",on);$("power").querySelector("small").textContent=on?"إطفاء":"تشغيل";$("led").classList.toggle("dim",!on);
  if(!on){stopStream();state("off","التلفزيون مطفي","اضغط زر التشغيل أو اختار قناة");$("nowname").textContent="—";$("led").textContent="CH ---";drawGrid()}
}
function syncFav(){const on=curKey&&favs.includes(curKey);$("favBtn").textContent=on?"★":"☆";$("favBtn").classList.toggle("on",!!on)}
function play(c,urlIdx=0){
  curKey=c.name.toLowerCase();curUrl=urlIdx;
  if(!isOn)setPower(true);
  const a=filtered();const idx=a.findIndex(x=>x.name.toLowerCase()===curKey);
  $("led").textContent="CH "+String(idx>=0?idx+1:0).padStart(3,"0");
  $("nowname").textContent=c.name;syncFav();save();drawGrid();
  stopStream();loading=true;
  state("load","عم نوصل لـ "+c.name+"…",c.urls.length>1?`رابط ${urlIdx+1} من ${c.urls.length}`:"");
  const src=c.urls[urlIdx];
  const nextUrl=()=>{clearTimeout(failTimer);if(curKey!==c.name.toLowerCase())return;
    if(urlIdx+1<c.urls.length)play(c,urlIdx+1);else state("fail","هالقناة ما عم تشتغل هلق","جرّب القناة التالية");};
  failTimer=setTimeout(()=>{if(v.readyState<2)nextUrl()},12000);
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({enableWorker:true,manifestLoadingMaxRetry:1,levelLoadingMaxRetry:1});
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)nextUrl()});
    hls.loadSource(src);hls.attachMedia(v);
  }else if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=src}
  else{state("fail","المتصفح ما بيدعم البث","");return}
  v.onerror=()=>{if(loading&&!hls)nextUrl()};
  v.play().catch(()=>{});
}
v.addEventListener("playing",()=>{if(!isOn)return;clearTimeout(failTimer);state("live")});

function step(d){
  const a=filtered();if(!a.length)return;
  let i=a.findIndex(x=>x.name.toLowerCase()===curKey);
  i=i<0?0:(i+d+a.length)%a.length;
  if(i>=shown){shown=i+1}
  play(a[i]);
}
function showOsd(){
  const bars=$("bars");bars.innerHTML="";const lv=v.muted?0:Math.round(vol*10);
  for(let k=1;k<=10;k++){const s=document.createElement("i");if(k<=lv)s.className="f";bars.appendChild(s)}
  $("osdIcon").textContent=(v.muted||vol===0)?"🔇":"🔊";
  $("osd").hidden=false;clearTimeout(osdTimer);osdTimer=setTimeout(()=>$("osd").hidden=true,1800);syncMute();save();
}
function syncMute(){$("mute").querySelector("span").textContent=v.muted?"🔇":"🔊";$("mute").classList.toggle("muted",v.muted)}
function setVol(d){vol=Math.min(1,Math.max(0,Math.round((vol+d)*10)/10));v.volume=vol;if(vol>0)v.muted=false;showOsd()}

$("volup").onclick=()=>setVol(+0.1);
$("voldn").onclick=()=>setVol(-0.1);
$("mute").onclick=()=>{v.muted=!v.muted;showOsd()};
$("power").onclick=()=>{if(isOn)setPower(false);else{const c=current();if(c)play(c);else step(0)}};
$("prev").onclick=()=>step(-1);
$("next").onclick=()=>step(+1);
$("ovNext").onclick=()=>step(+1);
$("favBtn").onclick=()=>{if(!curKey)return;favs=favs.includes(curKey)?favs.filter(k=>k!==curKey):[...favs,curKey];syncFav();save();render()};
$("refresh").onclick=()=>loadAll(true);
$("q").addEventListener("input",e=>{query=e.target.value.trim();shown=60;drawGrid()});
$("fs").onclick=()=>{try{const el=$("screen");
  if(el.requestFullscreen){const p=el.requestFullscreen();if(p&&p.catch)p.catch(()=>{if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()})}
  else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()}catch(e){}};
$("screen").addEventListener("click",e=>{if(e.target.closest("a,button"))return;if(isOn&&v.paused&&loading)v.play().catch(()=>{})});

function tick(){$("clock").textContent=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}
tick();setInterval(tick,20000);
syncMute();syncFav();
if(curKey){const c=allItems().get(curKey);if(c)$("nowname").textContent="آخر قناة: "+c.name}
render();loadAll(false);
/* app version: no service worker */
</script>
<!-- TV remote (D-pad) navigation: arrows move between buttons, OK presses -->
<style>
.tvnav-on button:focus,.tvnav-on a:focus,.tvnav-on input:focus{outline:4px solid #ffd400!important;outline-offset:3px!important;box-shadow:0 0 0 7px rgba(255,212,0,.35)!important;position:relative;z-index:5}
</style>
<script>
(function(){
  var SEL='button:not([hidden]):not([disabled]),a[href]:not([hidden]),input:not([hidden]):not([type=hidden]),[tabindex]:not([tabindex="-1"])';
  function vis(e){if(e.closest('[hidden]'))return false;var r=e.getBoundingClientRect();if(r.width<2||r.height<2)return false;var s=getComputedStyle(e);return s.visibility!=='hidden'&&s.display!=='none'}
  function all(){return Array.prototype.filter.call(document.querySelectorAll(SEL),vis)}
  function c(r){return{x:r.left+r.width/2,y:r.top+r.height/2}}
  function move(dir){
    var list=all();if(!list.length)return;
    var cur=document.activeElement;
    if(!cur||cur===document.body||list.indexOf(cur)<0){list[0].focus();return}
    var a=cur.getBoundingClientRect(),ac=c(a),best=null,bs=1e9;
    list.forEach(function(e){if(e===cur)return;var b=e.getBoundingClientRect(),bc=c(b),dx=bc.x-ac.x,dy=bc.y-ac.y,main,side;
      if(dir==='ArrowUp'){if(b.bottom>a.top+4&&dy>=-2)return;main=-dy;side=Math.abs(dx)}
      else if(dir==='ArrowDown'){if(b.top<a.bottom-4&&dy<=2)return;main=dy;side=Math.abs(dx)}
      else if(dir==='ArrowLeft'){if(dx>=-2)return;main=-dx;side=Math.abs(dy)}
      else{if(dx<=2)return;main=dx;side=Math.abs(dy)}
      var sc=main+side*2.5;if(sc<bs){bs=sc;best=e}});
    if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'})}
  }
  document.addEventListener('keydown',function(ev){
    var k=ev.key;
    if(k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight'){
      var t=document.activeElement;if(t&&t.tagName==='INPUT'&&(k==='ArrowLeft'||k==='ArrowRight'))return;
      document.documentElement.classList.add('tvnav-on');ev.preventDefault();move(k)}
    else if(k==='Enter'){var t2=document.activeElement;if(t2&&(t2.tagName==='BUTTON'||t2.tagName==='A')){ev.preventDefault();t2.click()}}
  },true);
  window.tvRemote=function(cmd){var id={up:'prev',down:'next'}[cmd];var e=cmd==='power'?(document.getElementById('power')||document.getElementById('pw')):document.getElementById(id);if(e)e.click()};
})();
</script>
