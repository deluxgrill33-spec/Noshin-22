plugins { id 'com.android.application' }
android {
    namespace 'com.delux.shashti'
    compileSdk 36
    defaultConfig {
        applicationId 'com.delux.shashti'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('keys/delux.keystore')
            storePassword 'deluxgrill'
            keyAlias 'delux'
            keyPassword 'deluxgrill'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
